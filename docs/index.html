<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Plyrty — Player Demo</title>
    <link rel="stylesheet" href="demo.css">
    <!-- Always load the actual player sources from the repository root. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/JuliaLoves/Plyrty@main/plyrty.css">
</head>
<body>
    <header class="demo-header">
        <h1 class="demo-title">Plyrty Player Demo</h1>
        <p class="demo-subtitle">HTML5 · HLS · MPEG-DASH</p>
    </header>

    <main class="player-container">
        <section class="player-wrapper" aria-label="Video player">
            <video id="my-player" class="plyrty" controls playsinline preload="metadata" width="100%">
                <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
            </video>
        </section>

        <section class="video-selector-container" aria-label="Demo streams">
            <label class="selector-label" for="videoSelect">Choose a test stream</label>
            <select id="videoSelect" class="video-select">
                <option value="0">Big Buck Bunny · MP4</option>
                <option value="1">Flower · MP4</option>
                <option value="2">Big Buck Bunny · HLS (adaptive)</option>
                <option value="3">Angel One · HLS</option>
                <option value="4">Angel One · MPEG-DASH</option>
                <option value="5">Sintel · MPEG-DASH</option>
            </select>
            <p id="videoDesc" class="video-description active" aria-live="polite">
                Open movie sample from the Blender Foundation. Progressive MP4 playback.
            </p>
            <p id="demoStatus" class="demo-status" role="status" aria-live="polite"></p>
        </section>
    </main>

    <footer class="demo-footer">
        <a href="https://github.com/JuliaLoves/Plyrty" class="btn-github" target="_blank" rel="noopener noreferrer">
            <span>View on GitHub</span>
        </a>
    </footer>

    <!-- Load the same player JavaScript that users install from the repository root. -->
    <script src="https://cdn.jsdelivr.net/gh/JuliaLoves/Plyrty@main/plyrty.js"></script>
    <script>
    (() => {
        'use strict';

        const streams = [
            {
                title: 'Big Buck Bunny · MP4',
                url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
                type: 'video/mp4',
                description: 'Open movie sample from the Blender Foundation. Progressive MP4 playback.'
            },
            {
                title: 'Flower · MP4',
                url: 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
                type: 'video/mp4',
                description: 'Small CC0 sample clip. Useful for a quick HTML5 playback check.'
            },
            {
                title: 'Big Buck Bunny · HLS',
                url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',
                type: 'application/x-mpegURL',
                description: 'Public Mux adaptive-bitrate HLS test stream with multiple quality levels.'
            },
            {
                title: 'Angel One · HLS',
                url: 'https://storage.googleapis.com/shaka-demo-assets/angel-one-hls/hls.m3u8',
                type: 'application/x-mpegURL',
                description: 'Shaka demo HLS stream. Includes multiple audio and video renditions.'
            },
            {
                title: 'Angel One · MPEG-DASH',
                url: 'https://storage.googleapis.com/shaka-demo-assets/angel-one/dash.mpd',
                type: 'application/dash+xml',
                description: 'Shaka demo MPEG-DASH stream with multiple codecs and language tracks.'
            },
            {
                title: 'Sintel · MPEG-DASH',
                url: 'https://storage.googleapis.com/shaka-demo-assets/sintel-mp4-only/dash.mpd',
                type: 'application/dash+xml',
                description: 'Blender Foundation Sintel sample in an MP4-only DASH presentation.'
            }
        ];

        const select = document.getElementById('videoSelect');
        const description = document.getElementById('videoDesc');
        const status = document.getElementById('demoStatus');
        const video = document.getElementById('my-player');

        function setStatus(message, state) {
            status.textContent = message || '';
            status.dataset.state = state || '';
        }

        async function selectStream(index) {
            const stream = streams[index];
            if (!stream) return;

            description.textContent = stream.description;
            setStatus('Loading ' + stream.title + '…', 'loading');

            try {
                if (typeof window.plyrtySetSource !== 'function') {
                    throw new Error('Plyrty did not load. Check the repository source URL or network connection.');
                }

                await window.plyrtySetSource(video, stream.url, stream.type);
                setStatus('Ready: ' + stream.title, 'success');
            } catch (error) {
                console.error('Plyrty demo stream error:', error);
                setStatus('Could not load this stream: ' + (error && error.message ? error.message : 'unknown error'), 'error');
            }
        }

        select.addEventListener('change', () => selectStream(Number(select.value)));

        video.addEventListener('error', () => {
            const mediaError = video.error;
            if (mediaError) {
                setStatus('Video playback error (' + mediaError.code + '). Try another sample stream.', 'error');
            }
        });

        // The first MP4 is already declared in the video element; do not reload it.
        setStatus('Ready: ' + streams[0].title, 'success');
    })();
    </script>
</body>
</html>
